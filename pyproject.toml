[project]
name = "grenton-native"
version = "0.0.1"
description = "Clean-room client for Grenton's native CLU UDP protocol (keyed from the OM .omp), packaged as a Home Assistant custom integration with a live communication-monitor panel."
readme = "README.md"
requires-python = ">=3.11"

# Runtime deps of the protocol library. Home Assistant already ships cryptography,
# so the integration's manifest lists no requirements; this is for standalone use
# (the spike) and for CI.
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Import the integration as `custom_components.grenton_native.*` from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
